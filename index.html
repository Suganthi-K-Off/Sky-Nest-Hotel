<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Nest Hotel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.hero{
    position:relative;
    height:100vh;
}
.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.hero-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
    color:white;
}
.hero-text h1{
    font-size:60px;
    font-weight:bold;
    text-shadow:3px 3px 10px black;
}
.hero-text p{
    font-size:22px;
    text-shadow:2px 2px 10px black;
}
.card img{
    height:250px;
    object-fit:cover;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
<div class="container">
<a class="navbar-brand fw-bold">🏨 SKY NEST HOTEL</a>
<div class="ms-auto">
<a href="#food" class="btn btn-primary me-2">Food</a>
<a href="#rooms" class="btn btn-success">Rooms</a>
</div>
</div>
</nav>
<div class="hero">
<img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1400&q=80">
<div class="hero-text">
<h1>WELCOME TO SKY NEST HOTEL</h1>
<p>Luxury Stay • Fine Dining • Best Experience</p>
<a href="#food" class="btn btn-primary">Explore Food</a>
<a href="#rooms" class="btn btn-success">View Rooms</a>
</div>
</div>
<div class="container mt-5" id="food">
<h2 class="text-center mb-4">🍽 Our Food Menu</h2>
<div class="row g-4">
<div class="col-md-4">
<div class="card">
<img src="https://www.naaginsauce.com/cdn/shop/articles/blog_cover_5.png?v=1758367909">
<div class="card-body text-center">
<h5>Biryani</h5>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card">
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=600&q=80">
<div class="card-body text-center">
<h5>Pizza</h5>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card">
<img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80">
<div class="card-body text-center">
<h5>Burger</h5>
</div>
</div>
</div>
</div>
</div>
<div class="container mt-5" id="rooms">
<h2 class="text-center mb-4">🛏 Luxury Rooms</h2>
<div class="row g-4">
<div class="col-md-4">
<div class="card">
<img src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=600&q=80">
<div class="card-body text-center">
<h5>Deluxe Room</h5>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card">
<img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=600&q=80">
<div class="card-body text-center">
<h5>Premium Room</h5>
</div>
</div>
</div>
<div class="col-md-4">
<div class="card">
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnNSY2gpcLYU-Za15QSGHlNct0CwhH6eQWsZWJ0smmfiYgcGsqvBmn5qex&s=10">
<div class="card-body text-center">
<h5>Suite Room</h5>
</div>
</div>
</div>
</div>
</div>
<div class="row justify-content-center">
<div class="col-md-8">
<div class="container mt-5" id="contact">
<h2 class="text-center mb-4">📩 Contact Us</h2>
<div class="row justify-content-center">
<div class="col-md-10 mx-auto">
<form>
<input type="text" class="form-control mb-3" placeholder="Your Name">
<input type="email" class="form-control mb-3" placeholder="Email ID">
<input type="tel" class="form-control mb-3" placeholder="Phone Number">
<textarea class="form-control mb-3" rows="5" placeholder="Message"></textarea>
<button type="submit" class="btn btn-dark w-100">
Submit
</button>
</form>
</div>
</div>
</div>
</div>
</body>
</html>
